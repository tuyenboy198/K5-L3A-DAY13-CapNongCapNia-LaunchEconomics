# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
# Số D1 và D3 in bằng nhiem_vu_d() trong src/lab13.py.
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: co_mau(0.70, 0.75) = 1.251 yêu cầu mỗi nhóm.
#   b) Theo nhân viên, m = 75: DE = 1 + 74 × 0,02 = 2,48 → 1.251 × 2,48 = 3.103 mỗi nhóm = 42 người/nhóm,
#      tổng 84 > 40 nhân viên → không đủ người.
#   c) 20 nhân viên mỗi nhóm: n hiệu dụng < c / ICC = 20 / 0,02 = 1.000 < 1.251 → không đạt, dù m lớn bao nhiêu.
#   d) 6 depot mỗi nhóm: n hiệu dụng < 6 / 0,02 = 300 → không đạt, và chỉ 6 cụm.
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 người mỗi nhóm: 20m / (0,98 + 0,02m) ≥ 859 → m ≥ 299 yêu cầu mỗi người (DE 6,96).
#   Chọn: chia theo NHÂN VIÊN, 20 + 20, mức chênh tối thiểu 6 điểm.
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng làm cùng tuần, cùng 6 depot, cùng loại yêu cầu.
#   2. Chia ngẫu nhiên hay do người chọn: Ngẫu nhiên, bốc thăm bằng code với seed ghi trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro chia sẻ câu trả lời trong depot; giảm bằng quyền truy cập theo
#      tài khoản và log lượt mở trợ lý theo staff_id (đối chứng mở được trợ lý = vi phạm, ghi nhận và báo cáo).
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, chốt trong file này trước ngày bắt đầu 2026-12-07.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên mỗi nhóm.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Với 40 nhân viên, không cách chia theo cụm nào đủ mẫu cho mức chênh 5 điểm. Nhóm chấp nhận mde = 6 điểm
#   (cần m ≥ 299 yêu cầu/người). Nếu tác động thật chỉ là 5 điểm thì power chỉ còn khoảng 0,64,
#   tức 36% khả năng bỏ lỡ tác động thật. Không chọn chia theo yêu cầu vì cùng một người vừa dùng vừa không dùng.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Hiện tại 4,25% (51/1.200); phạm vi noi_dia + hang_nang 3,97%. Ngưỡng tuyệt đối 3% sẽ dừng pilot ngay tuần đầu,
#   nên so với nhóm đối chứng: dừng khi nhóm trợ lý cao hơn đối chứng ≥ 2 điểm, kèm trần tuyệt đối 6%.
#
# Lịch: bắt đầu 2026-12-07; mỗi bước rollout một tuần; ~31 yêu cầu trong phạm vi/người/ngày (1.500 × 82% / 40)
#   → 299 yêu cầu/người cần ~10 ngày làm việc ở bước 0.50, cộng 7 ngày chờ mở lại → quyết định 2027-01-12.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ loại noi_dia (0,22×) và hang_nang (0,69×) so với 12.000 đ [simulated], tại 6 depot đang chạy thử; loại quoc_te (1,88×, thành công 27,3%) và doi_tac (0,85×, điều khoản riêng)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # 4 → 10 → 20 nhân viên; chỉ đo chỉ số chính từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận, xem chú thích đầu file
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96           # 1 + (299 - 1) × 0,02
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng làm cùng tuần, cùng 6 depot, cùng phạm vi noi_dia + hang_nang"
    spillover_risk: "Trung bình: nhân viên cùng depot có thể chia sẻ câu trả lời; giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id"
    predeclared: "Có: chỉ số chính, mde 0,06, luật dừng và ngày quyết định chốt trong file này trước 2026-12-07; seed bốc thăm ghi trước"
  stop_rules:
    - "NẾU tỉ lệ mở lại 7 ngày của nhóm trợ lý cao hơn đối chứng từ 2 điểm trở lên hoặc vượt 6%, hoặc có từ 1 ca hoàn tiền trùng TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút và mở điều tra KHÔNG THÌ không được sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công [simulated] vượt 8.000 đ TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp về noi_dia và giới hạn 2 lần chạy KHÔNG THÌ không được mở rộng sang hang_nang hoặc depot mới"
    - "NẾU tỉ lệ nhân viên nhóm trợ lý bỏ qua gợi ý vượt 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày và báo cáo lý do KHÔNG THÌ không được chuyển bước rollout"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bấm cờ tắt trợ lý, hiệu lực trong 30 phút; yêu cầu đang xử lý chuyển về hàng đợi nhân viên, khách được phục vụ bằng luồng nhân viên tự làm như trước pilot"
  decision_date: "2027-01-12"
  simulated_inputs:
    - "phut_xem_lai_simulated (890 phút, 1.780.000 đ)"
    - "phut_lam_lai_simulated (1.132 phút, 2.264.000 đ)"
    - "Chi phí mỗi việc thành công 4.472 đ và theo loại (0,22× · 0,69× · 1,88× · 0,85×)"
    - "Chi phí cả hệ thống 5.865 đ/yêu cầu = 0,49×"
    - "ICC 0,02 (giả định của lab)"
    - "m = 75 và m = 299 yêu cầu mỗi nhân viên"
    - "Toàn bộ logix_requests.csv và logix_runs.csv là dữ liệu giả lập"
